
name: Hello World CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # BUILD STAGE
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create website build
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - name: Verify build output
        run: |
          test -s dist/index.html
          grep -q "Hello, world!" dist/index.html

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # TEST STAGE
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  # DEPLOY STAGE
  deploy:
    name: Deploy
    needs: [build, test]
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Verify deployment branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Deployment is only allowed from main."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
